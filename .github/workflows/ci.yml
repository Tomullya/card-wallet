name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, tests, Newman, QA checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHON: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            wallet-api/requirements.txt
            fraud-service/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-java@v4  # Allure CLI needs Java
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          npm ci --no-audit --no-fund

      - name: Run everything (same script as locally)
        run: scripts/ci_local.sh

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/

      - name: Upload Allure report for Pages
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/allure-report

  pages:
    name: Publish Allure report
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
