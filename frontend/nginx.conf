server {
  listen 80;
  root /usr/share/nginx/html;

  # Docker's DNS, re-resolved every 10 s: a recreated wallet container keeps working.
  resolver 127.0.0.11 valid=10s;

  location /api/ {
    set $wallet http://wallet:8000;
    proxy_pass $wallet;
    proxy_set_header Host $host;
  }

  # Hashed build files: never fall back to index.html for a missing one.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
